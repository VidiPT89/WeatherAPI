name: Keep Render backend warm

# Render's free tier spins the service down after ~15 minutes of inactivity, and the next
# request then pays a cold-boot cost of up to a few minutes (Flyway + Hibernate init) --
# the repeated "não foi possível obter o tempo" failures during testing were this, not a
# client bug. Pinging a cheap, already-public endpoint often enough keeps it warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS "https://weatherapi-4r5x.onrender.com/api/v1/geocoding?query=lisboa&limit=1" > /dev/null
