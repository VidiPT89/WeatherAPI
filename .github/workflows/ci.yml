name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The integration tests run against a real PostgreSQL, the same engine as production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: weather_api_test
          POSTGRES_USER: weather_api
          POSTGRES_PASSWORD: weather_api_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: mvn -B verify
