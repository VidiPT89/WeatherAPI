server:
  port: ${PORT:8080}

spring:
  application:
    name: weather-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/weather_api}
    username: ${DB_USERNAME:weather_api}
    password: ${DB_PASSWORD:weather_api_local_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

weather:
  open-meteo:
    geocoding-url: https://geocoding-api.open-meteo.com/v1/search
    forecast-url: https://api.open-meteo.com/v1/forecast
    marine-url: https://marine-api.open-meteo.com/v1/marine
  open-weather-map:
    base-url: https://api.openweathermap.org/data/2.5/weather
    reverse-geocoding-url: https://api.openweathermap.org/geo/1.0/reverse
    api-key: ${OPENWEATHERMAP_API_KEY:}
  cache:
    ttl-minutes: 15
    max-size: 500
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

resilience4j:
  circuitbreaker:
    instances:
      open-meteo:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.vidi.weather.exception.CityNotFoundException
      open-weather-map:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.vidi.weather.exception.CityNotFoundException
  retry:
    instances:
      open-meteo:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.vidi.weather.exception.ProviderUnavailableException
      open-weather-map:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.vidi.weather.exception.ProviderUnavailableException

# No fallback for JWT_SECRET: a checked-in default -- even one labeled "local dev only" --
# is a public value the moment this repo is public, and a silently-unset env var in any real
# deployment would fall back to signing tokens with a secret anyone can read on GitHub.
# Missing the env var should fail startup, not fail open.
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
  # Stricter, IP-keyed limit for /api/v1/auth/** (login/register/refresh/logout have no
  # authenticated principal to key a bucket on, and are the endpoints brute-force/credential
  # stuffing attacks actually target).
  auth-requests-per-minute: ${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:10}
  # Any other request that reaches the filter without an authenticated principal -- i.e. a
  # protected endpoint hit with no token or a garbage/expired one -- falls back to this IP-keyed
  # limit instead of skipping rate limiting altogether until Spring Security rejects it with 401.
  unauthenticated-requests-per-minute: ${RATE_LIMIT_UNAUTHENTICATED_REQUESTS_PER_MINUTE:20}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    com.vidi.weather: INFO
